name: Deploy Film Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install numpy scipy pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate 3D LUT Profiles
        run: npm run generate-luts

      - name: Run Unit Tests
        run: npm test

      - name: Build static web application
        run: npm run build

      - name: Preserve beta build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          beta_run=$(gh run list --workflow beta.yml --branch beta --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$beta_run" && test "$beta_run" != "null"
          gh run download "$beta_run" --name film-studio-beta --dir .beta-artifact
          node tools/deployment/assemble-pages.mjs --production dist --beta .beta-artifact --output .pages-site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.pages-site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
